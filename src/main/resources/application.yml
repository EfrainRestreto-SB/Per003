quarkus:
  datasource:
    db-kind: db2
    username: db2inst1
    password: db2inst1
    jdbc:
      url: jdbc:db2://localhost:50000/TESTDB
      driver: com.ibm.db2.jcc.DB2Driver
      min-size: 2
      max-size: 10
      acquisition-timeout: 10s

  hibernate-orm:
    dialect: org.hibernate.dialect.DB2Dialect
    log:
      sql: true
      bind-parameters: true
    format-sql: true

  log:
    level: INFO  # Nivel global
    console:
      enable: true
      format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
      json: true
